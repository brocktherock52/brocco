<style>

  .not-found h1 span { background: linear-gradient(180deg, #fff 0%, #d1fae5 60%, var(--brand-glow) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .not-found p { color: var(--fg-mid); font-size: 17px; line-height: 1.55; margin: 0 0 32px; }
  .not-found .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .not-found code { font-family: var(--font-mono); background: var(--bg-2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px; color: var(--brand-glow); font-size: 14px; }
</style>
</head>

  <div class="not-found">

    <p>The croc lost the page. Or maybe ate it. Try the dashboard at <code>/app</code>, or jump back home.</p>
    <div class="links">
